openapi: 3.1.0
info:
  title: Chura API
  description: Backend API for Chura — Project/Backlog/Sprint/Ticket Agile management.
  version: 0.2.0
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is up
  /api/v1/templates:
    get:
      summary: List available Templates (getAvailableTemplates)
      operationId: getAvailableTemplates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/templates/{templateId}:
    get:
      summary: Retrieve a Template definition (retrieveTemplateDefinition)
      operationId: retrieveTemplateDefinition
      parameters:
        - { name: templateId, in: path, required: true, schema: { type: string, example: se } }
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects:
    post:
      summary: Create a Project / Project Board (createProjectBoard). Team Member only.
      operationId: createProjectBoard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "201":
          description: Created. The caller is the first member with the Template's creator role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/projects/{projectId}:
    get:
      summary: Retrieve Project data (retrieveProjectData). Members and Auditors only; other Team Members get 403 "you are not a member of this project".
      operationId: retrieveProjectData
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotProjectMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/projects/{projectId}/members:
    post:
      summary: Add a member by email with the Template's default role (addProjectMember). Project members only.
      operationId: addProjectMember
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
      responses:
        "201":
          description: Project with the new member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400":
          description: >-
            Malformed body, or a violation on `email`: blank, longer than 254
            characters, missing `@`, or "user is not a Team Member" (the person
            is an Auditor or has no Chura role).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotProjectMember" }
        "404":
          description: Unknown Project, or no user with this email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The person is already a member of the Project. `error` is "user is already a member of this project".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/projects/{projectId}/members/{userId}/role:
    put:
      summary: Assign a Project Role to a member (assignProjectRole). Project members only. The last holder of the creator role cannot be moved off it.
      operationId: assignProjectRole
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, example: scrum_master }
      responses:
        "200":
          description: Project with the updated member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotProjectMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/projects/{projectId}/work-items/validate:
    post:
      summary: Validate Work Item attributes against the Project's Template (validateWorkItemAttributes). Persists nothing; valid=false is still 200.
      operationId: validateWorkItemAttributes
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkItemAttributes" }
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotProjectMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: Request body larger than 1 MiB }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/sprints:
    post:
      summary: Create a Sprint inside a Project (createSprint). Team Member who belongs to the Project only.
      operationId: createSprint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SprintRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sprint" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotProjectMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    get:
      summary: List the Sprints of one Project (listSprints). Project members and Auditors only; other Team Members get 403 "you are not a member of this project".
      operationId: listSprints
      parameters:
        - name: project_id
          in: query
          required: true
          description: Required. Missing/blank gives 400 with a violation on project_id; a non-UUID gives 400 "invalid id".
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sprints
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Sprint" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotProjectMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/sprints/{sprintId}:
    parameters:
      - { name: sprintId, in: path, required: true, schema: { type: string, example: "7" } }
    get:
      summary: Retrieve a Sprint (getSprint). Members of its Project and Auditors only; Team Members outside the Project get 403 "you are not a member of this project".
      operationId: getSprint
      responses:
        "200":
          description: Sprint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sprint" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotProjectMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      summary: Update a Sprint (updateSprint). Team Members who belong to its Project only; project_id is immutable and ignored.
      operationId: updateSprint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SprintUpdateRequest" }
      responses:
        "200":
          description: The stored Sprint after the update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sprint" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotProjectMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      summary: Delete a Sprint (deleteSprint). Team Members who belong to its Project only.
      operationId: deleteSprint
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotProjectMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/sprints/{sprintId}/work-summary:
    parameters:
      - $ref: "#/components/parameters/SprintId"
    get:
      tags: [Analytics & Reporting]
      summary: >-
        Calculate the Sprint Work Summary (calculateSprintWorkSummary). Work
        items in the Sprint are planned; done ones are completed, blocked ones
        blocked and every other one carry-over. Members of the Project and
        Auditors only.
      operationId: calculateSprintWorkSummary
      responses:
        "200":
          description: Work summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SprintWorkSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotProjectMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/sprints/{sprintId}/metrics:
    parameters:
      - $ref: "#/components/parameters/SprintId"
    get:
      tags: [Analytics & Reporting]
      summary: Retrieve Sprint metrics, work items and progress (retrieveSprintMetrics). Members of the Project and Auditors only.
      operationId: retrieveSprintMetrics
      responses:
        "200":
          description: Sprint metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SprintMetrics" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotProjectMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/sprints/{sprintId}/reflections:
    parameters:
      - $ref: "#/components/parameters/SprintId"
    get:
      tags: [Analytics & Reporting]
      summary: List the Sprint's reflections, oldest first (retrieveSprintReflection). Members of the Project and Auditors only.
      operationId: retrieveSprintReflection
      responses:
        "200":
          description: Reflections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SprintReflection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotProjectMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/sprints/{sprintId}/reflections/me:
    parameters:
      - $ref: "#/components/parameters/SprintId"
    put:
      tags: [Analytics & Reporting]
      summary: >-
        Submit the caller's reflection for the Sprint (createSprintReflection).
        Answers are validated against the topics in the Project Template's
        `reflection` (went_well, stop, start); submitting again replaces the
        earlier answers. Team Members who belong to the Project only.
      operationId: createSprintReflection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReflectionRequest" }
      responses:
        "200":
          description: The stored reflection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SprintReflection" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotProjectMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/sprints/{sprintId}/review-summary:
    parameters:
      - $ref: "#/components/parameters/SprintId"
      - $ref: "#/components/parameters/Metrics"
    get:
      tags: [Analytics & Reporting]
      summary: >-
        Generate the standardized Sprint Review Summary
        (generateSprintReviewSummary): selected quantitative metrics plus the
        team's reflections grouped by topic. Members of the Project and
        Auditors only.
      operationId: generateSprintReviewSummary
      responses:
        "200":
          description: Sprint Review Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SprintReviewSummary" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotProjectMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/sprints/{sprintId}/review-summary/export:
    parameters:
      - $ref: "#/components/parameters/SprintId"
      - $ref: "#/components/parameters/Metrics"
      - name: format
        in: query
        required: false
        schema: { type: string, enum: [csv, markdown, md], default: csv }
    get:
      tags: [Analytics & Reporting]
      summary: Download the Sprint Review Summary as a file (exportSummaryReport). Members of the Project and Auditors only.
      operationId: exportSummaryReport
      responses:
        "200":
          description: File download (`Content-Disposition` attachment named sprint-{id}-review.csv or .md)
          content:
            text/csv: { schema: { type: string } }
            text/markdown: { schema: { type: string } }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/NotProjectMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/whoami:
    get:
      summary: Identity of the authenticated caller
      operationId: whoAmI
      responses:
        "200":
          description: Claims of the caller's token
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }
                  user_id: { type: string }
                  email: { type: string }
                  roles: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Keycloak access token. The realm role `member` acts as Team Member and
        `auditor` as Auditor; an account with neither or both roles gets 403.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SprintId:
      name: sprintId
      in: path
      required: true
      schema: { type: string, example: "7" }
    Metrics:
      name: metrics
      in: query
      required: false
      description: >-
        Comma-separated metric keys to include, e.g.
        `planned_items,completion_rate`. Must be offered by the Project
        Template's `sprint_review.metrics`; omitted means its `default_metrics`.
      schema: { type: string }
  responses:
    InvalidInput:
      description: >-
        Malformed id/body or rule violations. `error` is one of "invalid input"
        (with `violations`), "invalid id" or "invalid JSON body".
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: Missing, malformed or expired bearer token, or missing/blank `sub` or `email` claim. `error` is "unauthenticated".
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Account has no Chura role or both (`member` and `auditor`), or the role is not allowed for this action (e.g. Auditor mutating). `error` is "forbidden".
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotProjectMember:
      description: >-
        Either the caller is a Team Member who is not a member of this Project
        (`error` is "you are not a member of this project"), or the action is
        not allowed for the caller's role, e.g. an Auditor writing (`error` is
        "forbidden"). Auditors can see every Project.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The resource (Project, Sprint, Template, user or member) does not exist. `error` is "not found".
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: The identity provider (Keycloak) holding Project membership could not give a definite answer. `error` is "service unavailable".
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Duplicate member or last creator-role holder. `error` is "conflict".
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    AddMemberRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Exact email of an existing Team Member account (trimmed).
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Fixed public message per error class; internal details are never exposed (500 is "internal server error").
        violations:
          type: array
          items: { $ref: "#/components/schemas/Violation" }
    Violation:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    Template:
      type: object
      required: [id, name, mode, work_item_types, roles, default_role, creator_role, capabilities, validation_rules, reflection, sprint_review]
      properties:
        id: { type: string, example: se }
        name: { type: string }
        mode: { type: string, enum: [general, se] }
        work_item_types:
          type: array
          items: { type: string, enum: [task, user_story, bug] }
        roles: { type: array, items: { type: string } }
        default_role: { type: string }
        creator_role: { type: string }
        capabilities: { type: array, items: { type: string } }
        validation_rules: { $ref: "#/components/schemas/ValidationRules" }
        reflection: { $ref: "#/components/schemas/ReflectionTemplate" }
        sprint_review: { $ref: "#/components/schemas/SprintReviewTemplate" }
    ReflectionTemplate:
      type: object
      description: Topics a Sprint Reflection answers, in display order.
      properties:
        topics:
          type: array
          items:
            type: object
            properties:
              key: { type: string, enum: [went_well, stop, start] }
              question: { type: string, example: "What went well?" }
              hint: { type: string }
              required: { type: boolean }
              max_runes: { type: integer, example: 2000 }
    SprintReviewTemplate:
      type: object
      description: Metrics a Sprint Review Summary may show (in report order) and the defaults.
      properties:
        title: { type: string }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/MetricDefinition" }
        default_metrics:
          type: array
          items: { $ref: "#/components/schemas/MetricKey" }
    MetricKey:
      type: string
      description: The *_points metrics are offered by the SE template only.
      enum: [planned_items, completed_items, carry_over_items, blocked_items, completion_rate,
             planned_points, completed_points, carry_over_points, blocked_points, points_completion_rate]
    MetricDefinition:
      type: object
      properties:
        key: { $ref: "#/components/schemas/MetricKey" }
        label: { type: string }
        unit: { type: string, enum: [items, points, percent] }
    ValidationRules:
      type: object
      description: Rules that drive validateWorkItemAttributes for Projects using the Template.
      required: [required_fields, type_rules]
      properties:
        required_fields:
          type: array
          description: Text fields that must not be blank.
          items: { type: string, enum: [title, description] }
        story_points:
          type: object
          description: Present when story_points are constrained; a given value must be greater than greater_than.
          required: [greater_than]
          properties:
            greater_than: { type: integer, example: 0 }
        type_rules:
          type: array
          items:
            type: object
            required: [type, require_acceptance_criteria]
            properties:
              type: { type: string, enum: [task, user_story, bug] }
              description_format:
                type: string
                enum: [user_story]
                description: user_story requires "As a … I want … so that …".
              require_acceptance_criteria: { type: boolean }
    CreateProjectRequest:
      type: object
      required: [name, template_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: Trimmed; duplicates allowed }
        description: { type: string, maxLength: 2000, description: Trimmed }
        template_id: { type: string }
    Member:
      type: object
      required: [user_id, email, name, role]
      properties:
        user_id: { type: string }
        email: { type: string }
        name: { type: string, description: Trimmed first and last name, falling back to the username }
        role: { type: string }
    Project:
      type: object
      required: [id, name, description, template_id, mode, created_by, members, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        template_id: { type: string }
        mode: { type: string, enum: [general, se] }
        created_by: { type: string }
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkItemAttributes:
      type: object
      description: >-
        Draft attributes. No field is schema-required and no field is
        enum-, range- or length-checked by the schema: a missing/blank title,
        a type not allowed by the Template, non-positive story_points (SE) or
        an exceeded input cap still return 200 with valid=false and the
        matching violations, as decided by the Template's validation_rules and
        the input caps below. Input caps (every Template, counted in
        characters): title <= 200, description <= 10000, at most 50
        acceptance_criteria, each <= 1000. Request bodies over 1 MiB are
        rejected with 413 before validation.
      properties:
        type:
          type: string
          description: >-
            Must be one of the Template's work_item_types (General: task;
            SE: user_story, task, bug). Any other value, including an unknown
            type, returns 200 with valid=false and a violation on "type".
        title: { type: string, description: "Required (non-blank); at most 200 characters." }
        description: { type: string, description: "At most 10000 characters." }
        story_points:
          type: integer
          description: SE only - must be greater than 0 when provided. Unconstrained in General.
        acceptance_criteria:
          type: array
          description: At most 50 items, each at most 1000 characters.
          items: { type: string }
    ValidationResult:
      type: object
      required: [valid, violations]
      properties:
        valid: { type: boolean }
        violations:
          type: array
          items: { $ref: "#/components/schemas/Violation" }
    SprintRequest:
      type: object
      required: [project_id, name, team]
      properties:
        project_id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        team: { type: string, maxLength: 120 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        status: { type: string, enum: [planned, active, completed] }
    SprintUpdateRequest:
      type: object
      required: [name, team]
      properties:
        name: { type: string, maxLength: 120 }
        team: { type: string, maxLength: 120 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        status: { type: string, enum: [planned, active, completed] }
    Sprint:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string, format: uuid }
        name: { type: string }
        team: { type: string }
        start_date: { type: string, format: date-time }
        end_date: { type: string, format: date-time }
        status: { type: string, enum: [planned, active, completed] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkBucket:
      type: object
      properties:
        items: { type: integer }
        points: { type: integer }
    SprintWorkSummary:
      type: object
      description: planned = completed + carry_over + blocked.
      properties:
        planned: { $ref: "#/components/schemas/WorkBucket" }
        completed: { $ref: "#/components/schemas/WorkBucket" }
        carry_over: { $ref: "#/components/schemas/WorkBucket" }
        blocked: { $ref: "#/components/schemas/WorkBucket" }
    SprintProgress:
      type: [object, "null"]
      description: Null when the Sprint has no start or end date. Days count inclusively.
      properties:
        total_days: { type: integer }
        elapsed_days: { type: integer }
        remaining_days: { type: integer }
        time_elapsed_rate: { type: number }
    SprintMetrics:
      type: object
      properties:
        sprint: { $ref: "#/components/schemas/Sprint" }
        work_summary: { $ref: "#/components/schemas/SprintWorkSummary" }
        completion_rate: { type: number, description: Percentage of work items done, one decimal }
        points_completion_rate: { type: number }
        status_breakdown: { type: object, additionalProperties: { type: integer } }
        type_breakdown: { type: object, additionalProperties: { type: integer } }
        progress: { $ref: "#/components/schemas/SprintProgress" }
        work_items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              type: { type: string }
              status: { type: string }
              priority: { type: string }
              assignee_id: { type: string }
              story_points: { type: integer }
              category: { type: string, enum: [completed, carry_over, blocked] }
        calculated_at: { type: string, format: date-time }
    ReflectionRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          additionalProperties: { type: string, maxLength: 2000 }
          example: { went_well: Daily stand-ups kept us aligned, stop: Merging on the last day, start: Writing tests first }
    SprintReflection:
      type: object
      properties:
        id: { type: string }
        sprint_id: { type: string }
        project_id: { type: string, format: uuid }
        author_id: { type: string }
        author_email: { type: string }
        template_id: { type: string }
        answers: { type: object, additionalProperties: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SprintReviewSummary:
      type: object
      properties:
        title: { type: string }
        project:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        sprint: { $ref: "#/components/schemas/Sprint" }
        template_id: { type: string }
        quantitative:
          type: object
          properties:
            metrics:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/MetricDefinition"
                  - type: object
                    properties:
                      value: { type: number }
            work_summary: { $ref: "#/components/schemas/SprintWorkSummary" }
            progress: { $ref: "#/components/schemas/SprintProgress" }
        qualitative:
          type: object
          properties:
            topics:
              type: array
              items:
                type: object
                properties:
                  key: { type: string }
                  question: { type: string }
                  responses:
                    type: array
                    items:
                      type: object
                      properties:
                        author_id: { type: string }
                        author_email: { type: string }
                        answer: { type: string }
            respondents: { type: integer }
            team_size: { type: integer }
            response_rate: { type: number }
        generated_at: { type: string, format: date-time }
