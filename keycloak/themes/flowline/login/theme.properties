# Flowline - Keycloak login theme
# Extends the current default login theme (PatternFly based, Keycloak 24+)
parent=keycloak.v2

# parent stylesheet first, ours last so it can override it
styles=css/styles.css css/flowline.css
scripts=js/flowline.js

# white background is part of the design, so opt out of the automatic dark mode
darkMode=false
