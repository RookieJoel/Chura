services:
  db:
    image: postgres:16-alpine
    container_name: chura-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chura
    ports:
      - "5432:5432"
    volumes:
      - chura-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chura"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chura-api
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/chura
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "9000:9000"

  pgadmin:
    image: dpage/pgadmin4
    container_name: chura-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - chura-pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  chura-postgres-data:
  chura-pgadmin-data:
