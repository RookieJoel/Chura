services:
  db:
    image: mongo:8
    container_name: chura-mongo
    environment:
      MONGO_INITDB_DATABASE: chura
    ports:
      - "27017:27017"
    volumes:
      - chura-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: chura-postgres
    environment:
      POSTGRES_USER: chura
      POSTGRES_PASSWORD: chura
      POSTGRES_DB: chura
    ports:
      - "5434:5432"
    volumes:
      - chura-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chura -d chura"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chura-api
    environment:
      MONGODB_URI: mongodb://db:27017
      MONGODB_DATABASE: chura
      DATABASE_URL: postgres://chura:chura@postgres:5432/chura?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "9000:9000"

  mongo-express:
    image: mongo-express:1
    container_name: chura-mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://db:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      db:
        condition: service_healthy

volumes:
  chura-mongo-data:
  chura-postgres-data:
