name: chura-identity-provider
services:
  keycloak-db:
    image: postgres
    container_name: chura-keycloak-postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-h", "localhost", "-p", "5432", "-U", "keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - chura-keycloak-data:/var/lib/postgresql
    networks:
      - chura-keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: chura-keycloak
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    command:
      - start-dev
      - --import-realm
      - --spi-theme--static-max-age=-1
      - --spi-theme--cache-themes=false
      - --spi-theme--cache-templates=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${DB_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_SPI_THEME_DEFAULT: flowline
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    ports:
      - "8080:8080"
    volumes:
      - ../keycloak/themes/flowline:/opt/keycloak/themes/flowline:ro
      - ../keycloak/realm-config.json:/opt/keycloak/data/import/realm-config.json:ro
    networks:
      - chura-keycloak

volumes:
  chura-keycloak-data:
    name: chura-keycloak-data

networks:
  chura-keycloak:
    name: chura-keycloak
    driver: bridge
