# Kong declarative config (DB-less). Upstreams use Consul DNS names; Kong's
# resolver is Consul (:8600), set in deploy/kong/entrypoint.sh.
# Scale a service in Compose; new nodes register the same Name and appear in DNS.
# After editing: docker compose -f deploy/docker-compose.yml restart kong
#
# Regex paths must start with "/"; set regex_priority > 0 to treat them as regex.
_format_version: "2.1"

services:
  - name: chura-analytics
    host: chura-analytics.service.consul
    port: 8056
    protocol: http
    routes:
      - name: chura-analytics-routes
        regex_priority: 200
        paths:
          - /api/v1/sprints/[^/]+/work-summary$
          - /api/v1/sprints/[^/]+/work-summary/export$
          - /api/v1/sprints/[^/]+/metrics$
          - /api/v1/sprints/[^/]+/reflections$
          - /api/v1/sprints/[^/]+/reflections/me$
          - /api/v1/sprints/[^/]+/review-summary$
          - /api/v1/sprints/[^/]+/review-summary/export$
        strip_path: false

  - name: chura-sprint
    host: chura-sprint.service.consul
    port: 8057
    protocol: http
    routes:
      - name: chura-sprint-item
        regex_priority: 100
        paths:
          - /api/v1/sprints/[^/]+$
        strip_path: false
      - name: chura-sprint-collection
        paths:
          - /api/v1/sprints
        strip_path: false

  - name: chura-project
    host: chura-project.service.consul
    port: 8059
    protocol: http
    routes:
      - name: chura-project-routes
        paths:
          - /api/v1/templates
          - /api/v1/projects
          - /api/v1/whoami
        strip_path: false
      - name: chura-health
        paths:
          - /health
        strip_path: false

  - name: chura-workitem
    host: chura-workitem.service.consul
    port: 8058
    protocol: http
    routes:
      - name: chura-workitem-ws
        paths:
          - /ws/work-items
          - /ws
        strip_path: false
