# Kong declarative config (DB-less). Kong loads this on start; after editing,
# run `docker compose -f deploy/docker-compose.yml restart kong`.
# "2.1" is the format version for Kong 2.x (the kong image in docker-compose.yml).
_format_version: "2.1"

upstreams:
  - name: chura-api-upstream
    algorithm: round-robin
    healthchecks:
      # Kong probes /health on every target on its own
      active:
        type: http
        http_path: /health
        healthy:   { interval: 5, successes: 1 }
        unhealthy: { interval: 5, http_failures: 2, tcp_failures: 2, timeouts: 2 }
      # and also marks a target unhealthy when real traffic to it keeps failing
      passive:
        unhealthy: { http_failures: 3, tcp_failures: 3, timeouts: 3 }
    # One target per API replica in docker-compose.yml. Equal weights split
    # traffic evenly; e.g. 200/100/100 would send api-1 half of it.
    targets:
      - target: agile-execution-api-1:8083
        weight: 100
      - target: agile-execution-api-2:8083
        weight: 100
      - target: agile-execution-api-3:8083
        weight: 100

services:
  - name: chura-api
    host: chura-api-upstream # must match the upstream name above
    port: 8083
    protocol: http
    routes:
      - name: chura-api-route
        paths: [/api, /health, /ws]
        strip_path: false
