x-agile-execution-environment: &agile-execution-environment
  MONGODB_URI: mongodb://mongo-db:27017
  MONGODB_DATABASE: chura
  PORT: 8083
  KC_JWKS_ENDPOINT: http://keycloak:8080/realms/chura/protocol/openid-connect/certs
  KC_BASE_URL: http://keycloak:8080
  KC_REALM: chura
  KC_BACKEND_CLIENT_ID: chura-backend
  KC_BACKEND_CLIENT_SECRET: ${KC_BACKEND_CLIENT_SECRET:?set KC_BACKEND_CLIENT_SECRET (dev value is in backend/.env.example)}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-chura_dev}:${RABBITMQ_PASSWORD:-change_me_dev}@rabbitmq:5672/
  DATABASE_URL: postgresql://chura:admin@postgre-db:5432/chura

# Shared by the API replicas below. They publish no ports: Kong is the only
# way in, and it load-balances across them (see kong/kong.yml).
x-agile-execution-api: &agile-execution-api
  build:
    context: ../backend
    dockerfile: Dockerfile
  env_file:
    - ../backend/.env
  depends_on:
    mongo-db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    postgre-db:
      condition: service_healthy
    agile-execution-migrations:
      condition: service_completed_successfully
  networks:
    - agile-execution-api
    - agile-execution-mongodb
    - chura-keycloak

name: chura-agile-execution-service
services:
  
  mongo-db:
    image: mongo:8
    container_name: chura-agile-execution-mongodb
    environment:
      MONGO_INITDB_DATABASE: chura
    ports:
      - "27017:27017"
    volumes:
      - agile-execution-mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agile-execution-mongodb

  rabbitmq:
    image: rabbitmq:4-management
    container_name: chura-agile-execution-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-chura_dev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change_me_dev}
    ports:
      - "5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - agile-execution-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agile-execution-api

  agile-execution-api-1:
    <<: *agile-execution-api
    container_name: chura-agile-execution-api-1
    environment:
      <<: *agile-execution-environment
      INSTANCE_NAME: api-1

  agile-execution-api-2:
    <<: *agile-execution-api
    container_name: chura-agile-execution-api-2
    environment:
      <<: *agile-execution-environment
      INSTANCE_NAME: api-2

  agile-execution-api-3:
    <<: *agile-execution-api
    container_name: chura-agile-execution-api-3
    environment:
      <<: *agile-execution-environment
      INSTANCE_NAME: api-3

  kong:
    # 2.8 rather than 3.x: Konga only fully supports Kong 2.x.
    image: kong:2.8
    container_name: chura-kong
    environment:
      # DB-less: all config comes from kong/kong.yml; edit the file, not Konga
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      # Kong takes over the API's port, so the frontend needs no change
      - "8083:8000"
      - "127.0.0.1:8001:8001"
    depends_on:
      agile-execution-api-1:
        condition: service_started
      agile-execution-api-2:
        condition: service_started
      agile-execution-api-3:
        condition: service_started
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agile-execution-api

  # Read-only dashboard for Kong: http://localhost:1338 (admin / admin1234).
  # Kong is DB-less, so creating or editing entities in Konga fails by design.
  konga:
    image: pantsel/konga:0.14.9
    container_name: chura-konga
    environment:
      NODE_ENV: production
      TOKEN_SECRET: chura-konga-dev-secret
      # No DB_ADAPTER: Konga keeps its login and Kong connection on local disk,
      # which avoids its incompatibility with Postgres 12+.
      KONGA_SEED_USER_DATA_SOURCE_FILE: /seed/users.js
      KONGA_SEED_KONG_NODE_DATA_SOURCE_FILE: /seed/nodes.js
    volumes:
      - ./konga:/seed:ro
      - konga-data:/app/kongadata
    ports:
      # host 1338, not Konga's default 1337: Razer Synapse's SDK server holds 1337
      - "127.0.0.1:1338:1337"
    depends_on:
      kong:
        condition: service_healthy
    networks:
      - agile-execution-api

  agile-execution-migrations:
    build:
      context: images/
      dockerfile: goose.Dockerfile
    container_name: chura-agile-execution-migrations
    restart: "no"
    command:
      - -dir=/migrations
      - postgres
      - postgres://chura:admin@postgre-db:5432/chura?sslmode=disable
      - up
    volumes:
      - ../backend/internal/adapter/db/postgres/migrations:/migrations:ro
    depends_on:
      postgre-db:
        condition: service_healthy
    networks:
      - agile-execution-api

  postgre-db:
    image: postgres
    container_name: chura-agile-execution-postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    ports:
      # host port follows DATABASE_URL in backend/.env (Makefile passes CHURA_PG_PORT)
      - "${CHURA_PG_PORT:-5432}:5432"
    volumes:
      - agile-execution-postgres-data:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: chura
      POSTGRES_DB: chura
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U chura"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agile-execution-api

  mongo-express:
    image: mongo-express:1
    container_name: chura-agile-execution-mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo-db:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      mongo-db:
        condition: service_healthy
    networks:
      - agile-execution-mongodb

volumes:
  agile-execution-mongodb-data:
  agile-execution-rabbitmq-data:
  agile-execution-postgres-data:
    name: chura-agile-execution-postgres-data
  konga-data:
    name: chura-konga-data

networks:
  agile-execution-api:
    driver: bridge
  agile-execution-mongodb:
    driver: bridge
  chura-keycloak:
    external: true
    name: chura-keycloak